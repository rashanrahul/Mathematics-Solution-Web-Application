<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Rahul MathSolve</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f4f3ec; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .box { text-align: center; padding: 40px 24px; max-width: 360px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; color: #1a2118; margin-bottom: 8px; }
    p { font-size: 14px; color: #6b7268; line-height: 1.6; margin-bottom: 24px; }
    button { padding: 10px 24px; background: #2d5a3d; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">📶</div>
    <h1>You're offline</h1>
    <p>Internet connection නැත. Connect වී නැවත උත්සාහ කරන්න.<br><br>No internet connection. Please check your network and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
